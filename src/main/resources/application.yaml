spring:
  application:
    name: ColorToMQTTApp
app:
  defaultSettings:
    screenHeight: 200
    screenWight: 200
    updatePeriod: 5 #ms
    sensitivity: 30 #min 0 max 100
    processor: ru.mkilord.colortomqttapp.core.processor.ChessProcessor
    detector: ru.mkilord.colortomqttapp.core.detector.AverageColorDetector
    screenAreaType: ru.mkilord.colortomqttapp.core.screenshoter.screenArea.DefaultScreenArea
    cellSize: 10
    #MQTT
    broker: "tcp://192.168.0.126:1883"
    topic: colorToMQTT
    username: mqtt-user
    password: 123qwe123QWE

    minHUE: 0
    maxHUE: 360
    minSaturation: 10
    maxSaturation: 100
    minBrightness: 0
    maxBrightness: 100

